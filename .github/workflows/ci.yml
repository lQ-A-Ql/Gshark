name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Go fmt check
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Backend boundary check
        run: go test ./internal/architecture -run TestBackendArchitectureBoundaries -count=1 -v

      - name: Backend focused contracts
        run: go test ./internal/engine -run "TestGatherEvidence|Test.*InvestigationReport|TestBundledPublic" -count=1 -v

      - name: Backend foundational contracts
        run: go test ./internal/servicecontract ./internal/report ./internal/mcp -count=1 -v

      - name: Backend API contract suite
        run: go test ./internal/transport -run "TestRegisteredAPIRoutesHaveContractCases|Test.*Contract|TestHandle.*Context|TestHandle.*Method|TestHandle.*Invalid" -count=1 -v

      - name: Backend governance register check
        run: go test ./internal/governance -run "Test.*Defect|Test.*Report|Test.*Archive" -count=1 -v

      - name: Feature gap remediation tests
        run: go test ./internal/engine -run "TestDNP3|TestIEC104|TestRTP|TestIOC|TestMITRE|TestRuleManager|TestMalleable|TestBruteForce|TestDataExfiltration|TestDNSTunnel|TestPlaybook" -count=1 -v

      - name: Go test
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go vulnerability scan
        run: govulncheck ./...

      - name: Backend coverage report
        run: |
          go test ./... -covermode=count -coverprofile="${RUNNER_TEMP}/gshark-backend-cover.out"
          go tool cover -func="${RUNNER_TEMP}/gshark-backend-cover.out"

      - name: Ignored tracked files check
        working-directory: .
        run: |
          test -z "$(git ls-files -ci --exclude-standard)" || (git ls-files -ci --exclude-standard && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.31.0 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Frontend quality
        run: pnpm run ci:quality

      - name: Frontend boundaries
        run: pnpm run ci:boundaries

      - name: Desktop IPC policy
        run: pnpm run ci:desktop

      - name: Tests and build
        run: pnpm run ci:test-build

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.31.0 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Wails desktop assets
        working-directory: frontend
        run: pnpm run build:wails

      - name: Check desktop assets
        run: .\scripts\check-desktop-assets.ps1

      - name: Root desktop dev-tag tests
        run: go test -tags dev ./...

      - name: Root desktop production-tag tests
        run: go test -tags production ./...
